# Source: https://github.com/JamesIves/github-pages-deploy-action

name: Build and Deploy
on:
  push:
    branches:
      - main  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: actions/setup-node@v6 #this installs node and npm for us
      with:
        node-version: '22.x' 
    - name: Build
      run: |
        npm install
        npm run build
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        BRANCH: gh-pages #default branch deployed from, but can be configured
        FOLDER: dist/browser
