@if (slotInput()) {
  @let slot = slotInput();
  <section
    class="slot"
    [class.slot-a]="!slot!.isOdd"
    [class.slot-b]="slot!.isOdd"
    [class.is-favorite]="slot!.isFavorite"
    (click)="toggleFavoriteSlot()"
  >
    <!-- <div>{{ slot!.day }}</div> -->
    <div class="band hide-scrollbars">{{ slot!.band }}</div>
    <div class="time">
      {{ printTime(slot!.startHour) }}:{{ printTime(slot!.startMinute) }} >
      <div class="end">
        > {{ printTime(slot!.endHour) }}:{{ printTime(slot!.endMinute) }}
      </div>
    </div>
  </section>
}
